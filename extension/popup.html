<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { width: 360px; margin: 0; font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #0b0b0b; background: #fff; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #0a0a0a; color: #fff; }
  header img { width: 24px; height: 24px; }
  header h1 { flex: 1; margin: 0; font-size: 15px; font-weight: 800; }
  header h1 span { color: #ff6a00; }
  .switch { position: relative; width: 42px; height: 24px; }
  .switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .switch span { position: absolute; inset: 0; border-radius: 12px; background: #57534e; pointer-events: none; transition: background .15s; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + span { background: #ff6a00; }
  .switch input:checked + span::after { transform: translateX(18px); }
  .switch input:focus-visible + span { outline: 3px solid #fff; outline-offset: 2px; }
  [role=tablist] { display: flex; border-bottom: 1px solid #e7e2db; }
  [role=tab] { flex: 1; padding: 9px; border: 0; border-bottom: 3px solid transparent; background: none; font: inherit; font-weight: 700; color: #57534e; cursor: pointer; }
  [role=tab][aria-selected=true] { border-color: #ff6a00; color: #0b0b0b; }
  [role=tab]:focus-visible, a:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid #c2410c; outline-offset: -3px; }
  .verdict { padding: 14px 16px; border-left: 5px solid var(--c); background: var(--t); }
  .verdict h2 { margin: 0; font-size: 20px; font-weight: 800; color: var(--c); }
  .verdict small { display: block; color: #57534e; }
  .verdict p { margin: 6px 0 0; }
  .next { font-weight: 700; }
  .bar { display: flex; gap: 2px; height: 8px; margin: 12px 16px 4px; }
  .bar i { display: block; border-radius: 2px; }
  .pass { background: #15803d; } .warn { background: #a15c00; } .fail { background: #c81e1e; } .skip { background: #e7e2db; }
  .count { margin: 0 16px; font-size: 12px; color: #57534e; }
  .group { margin: 10px 16px 0; }
  .group h3 { margin: 0 0 4px; font-size: 13px; }
  .item { display: grid; grid-template-columns: 18px 1fr; gap: 4px; padding: 4px 0; border-top: 1px solid #f1eeea; }
  .item b { display: block; }
  .item span.d { color: #57534e; font-size: 13px; }
  .sign { font-weight: 800; text-align: center; }
  details { margin: 8px 16px 0; }
  summary { cursor: pointer; font-weight: 700; padding: 4px 0; }
  .about { margin: 10px 16px 0; color: #57534e; font-size: 13px; }
  .actions { display: flex; gap: 8px; margin: 12px 16px 0; }
  button.main { flex: 1; padding: 8px; border: 2px solid #0a0a0a; border-radius: 4px; background: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  button.main:hover { background: #0a0a0a; color: #fff; }
  .empty { padding: 28px 20px; text-align: center; color: #57534e; }
  .empty b { display: block; margin-bottom: 4px; font-size: 16px; color: #0b0b0b; }
  .hero { display: flex; align-items: center; gap: 16px; padding: 16px; }
  .ring { position: relative; flex: none; width: 92px; height: 92px; }
  .ring svg { width: 92px; height: 92px; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 10; }
  .ring .track { stroke: #e7e2db; }
  .ring .safe { stroke: #ff6a00; stroke-linecap: round; }
  .ring b { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; font-size: 22px; font-weight: 800; line-height: 1; }
  .ring small { display: block; margin-top: 3px; font-size: 11px; font-weight: 500; color: #57534e; }
  #status { margin: 0; font-size: 16px; font-weight: 800; }
  #detail { margin: 3px 0 0; color: #57534e; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 16px; }
  .stat { padding: 10px 6px; border-radius: 6px; background: #f7f5f2; text-align: center; }
  .stat b { display: block; font-size: 20px; font-weight: 800; }
  .stat span { font-size: 12px; color: #57534e; }
  .note { margin: 12px 16px 0; padding: 8px 10px; border-left: 3px solid #ff6a00; background: #fff4ec; font-size: 12px; }
  footer { display: flex; justify-content: space-between; gap: 10px; padding: 12px 16px 14px; }
  a { color: #c2410c; font-weight: 600; }

  /* Motion. Everything enters once; only a running check keeps moving. */
  header img.live { animation: breathe 1.1s ease-in-out infinite; }
  [role=tablist] { position: relative; }
  [role=tab] { border-bottom-color: transparent !important; }
  .ink { position: absolute; left: 0; bottom: -1px; width: 50%; height: 3px; background: #ff6a00; transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
  .ink.right { transform: translateX(100%); }
  .verdict { position: relative; display: flex; gap: 12px; align-items: flex-start; animation: rise .34s cubic-bezier(.2, .8, .2, 1) both; }
  .verdict > div:first-child { flex: 1; min-width: 0; }
  .gauge { position: relative; flex: none; width: 58px; height: 58px; }
  .gauge svg { width: 58px; height: 58px; transform: rotate(-90deg); }
  .gauge circle { fill: none; stroke-width: 9; }
  .gauge .track { stroke: rgba(0, 0, 0, .1); }
  .gauge .arc { stroke: var(--c); stroke-linecap: round; transition: stroke-dashoffset .9s cubic-bezier(.3, .7, .2, 1) .1s; }
  .gauge b { position: absolute; inset: 0; display: grid; place-content: center; font-size: 15px; font-weight: 800; color: var(--c); }
  .bar i { transform-origin: left; animation: grow .5s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--n) * 90ms + .15s); }
  .count, .group, details, .about, .actions, .dna, .letter { animation: rise .32s ease-out both; animation-delay: .22s; }
  .item { animation: rise .3s ease-out both; animation-delay: calc(var(--n) * 60ms + .28s); }
  .safe { transition: stroke-dashoffset 1s cubic-bezier(.3, .7, .2, 1) .1s; }
  .dna { margin: 12px 16px 0; padding: 10px; border-radius: 6px; background: #0a0a0a; color: #fff; }
  .dna p { margin: 0 0 6px; font-size: 12px; color: #e7e2db; }
  .dna p b { color: #ff6a00; }
  .helix { display: flex; align-items: flex-end; gap: 1px; height: 24px; }
  .helix i { flex: 1; min-width: 0; height: var(--h); border-radius: 1px; background: #ff6a00; transform-origin: bottom; animation: bars .36s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--n) * 7ms + .3s); }
  .letter { margin: 10px 16px 0; font-size: 13px; }
  a.main { flex: 1; padding: 8px; border: 2px solid #c81e1e; border-radius: 4px; background: #c81e1e; color: #fff; font-weight: 700; text-align: center; text-decoration: none; }
  a.main:hover { background: #fff; color: #c81e1e; }
  .scanner { position: relative; margin: 16px; padding: 14px 16px; overflow: hidden; border: 1px solid #e7e2db; border-radius: 6px; }
  .scanner b { font-size: 16px; }
  .scanner::after { content: ""; position: absolute; left: 0; right: 0; top: -40px; height: 40px; border-bottom: 2px solid #ff6a00; background: linear-gradient(to bottom, transparent, rgba(255, 106, 0, .28)); animation: beam 1.1s ease-in-out infinite alternate; }
  .scanner ul { margin: 8px 0 0; padding: 0; list-style: none; color: #57534e; }
  .scanner li { opacity: .35; animation: lit 2.6s linear infinite; animation-delay: calc(var(--n) * .4s); }
  .mailbox { width: 58px; margin: 0 auto 10px; display: block; animation: float 3.4s ease-in-out infinite; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  @keyframes grow { from { transform: scaleX(0); } }
  @keyframes bars { from { transform: scaleY(.1); opacity: 0; } }
  @keyframes breathe { 50% { transform: scale(1.14); } }
  @keyframes beam { to { top: 100%; } }
  @keyframes lit { 0%, 30% { opacity: 1; color: #0b0b0b; } 60% { opacity: .35; } }
  @keyframes float { 50% { transform: translateY(-7px) rotate(-3deg); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .scanner::after { display: none; }
    .scanner li { opacity: 1; }
  }
</style>
</head>
<body>
  <header>
    <img id="logo" src="icons/48.png" alt="">
    <h1>MAIL<span>icious</span></h1>
    <label class="switch" aria-label="Check mails I open"><input type="checkbox" id="enabled"><span></span></label>
  </header>

  <div role="tablist" aria-label="MAILicious views">
    <button role="tab" id="tab-mail" aria-selected="true" aria-controls="view-mail">This mail</button>
    <button role="tab" id="tab-stats" aria-selected="false" aria-controls="view-stats">My protection</button>
    <span class="ink" id="ink" aria-hidden="true"></span>
  </div>

  <section id="view-mail" role="tabpanel" aria-labelledby="tab-mail"></section>

  <section id="view-stats" role="tabpanel" aria-labelledby="tab-stats" hidden>
    <div class="hero">
      <div class="ring" role="img" id="ring">
        <svg viewBox="0 0 96 96" aria-hidden="true">
          <circle class="track" cx="48" cy="48" r="42"></circle>
          <circle class="safe" id="safeArc" cx="48" cy="48" r="42"></circle>
        </svg>
        <b><span id="share">–</span><small>clear</small></b>
      </div>
      <div>
        <p id="status"></p>
        <p id="detail"></p>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b id="checked">0</b><span>Checked</span></div>
      <div class="stat"><b id="clear">0</b><span>Clear</span></div>
      <div class="stat"><b id="caught">0</b><span>Flagged</span></div>
    </div>
    <p class="note">While this is on, each mail you open goes to Google's AI to be read. We don't save it. Switch off before opening anything private.</p>
  </section>

  <footer>
    <a href="https://mailicious.vercel.app" target="_blank" rel="noopener">Website</a>
    <a href="https://mailicious.vercel.app/technology" target="_blank" rel="noopener">How it works</a>
    <a href="https://mailicious.vercel.app/rescue" target="_blank" rel="noopener">Already got scammed?</a>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
